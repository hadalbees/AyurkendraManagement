{% load static %}
<!DOCTYPE html>
<html lang="en">

{% include "includes/head.html" %}

<body class="g-sidenav-show bg-gray-100">

{% include "includes/sidebar.html" %}

<main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg">
{% include "includes/header.html" %}

<div class="container-fluid py-4">
<!-- PAGE HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h4 class="fw-bold mb-1">Add Expenses</h4>
      <p class="text-muted text-sm mb-0">
        Add and track operational expenses
      </p>

    </div>

    <a href="{% url 'accountmgmt:expense_list' %}"
       class="btn btn-outline-secondary rounded-pill px-4">
      ← Back
    </a>
  </div>
  <div class="card shadow-sm border-0">

    <!-- ================= FORM ================= -->
    <div class="card-body">

      <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="row g-3">

          <!-- DATE -->
          <div class="col-md-4">
            <label class="form-label text-sm">Expense Date</label>
            <input type="date"
                   name="expense_date"
                   class="form-control"
                   required>
          </div>

          <!-- CATEGORY -->
          <div class="col-md-4">
            <label class="form-label text-sm">Category</label>
            <select name="category" class="form-select" required>
              <option value="">Select Category</option>
              <option value="Salary">Salary</option>
              <option value="Rent">Rent</option>
              <option value="Electricity">Electricity</option>
              <option value="Purchase">Purchase</option>
              <option value="Maintenance">Maintenance</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <!-- AMOUNT -->
          <div class="col-md-4">
            <label class="form-label text-sm">Amount (₹)</label>
            <input type="number"
                   name="amount"
                   class="form-control"
                   placeholder="Enter amount"
                   required>
          </div>

          <!-- DESCRIPTION -->
          <div class="col-md-8">
            <label class="form-label text-sm">Description</label>
            <input type="text"
                   name="description"
                   class="form-control"
                   placeholder="Expense description"
                   required>
          </div>

          <!-- ATTACHMENT -->
          <div class="col-md-4">
            <label class="form-label text-sm">Attachment</label>
            <input type="file"
                   name="attachment"
                   class="form-control"
                   accept=".jpg,.jpeg,.png,.pdf">
            <small class="text-muted">
              Allowed formats: JPG, PNG, PDF
            </small>
          </div>

          <div class="col-md-4">
          <label class="form-label text-sm">Payment Mode</label>
          <select name="payment_mode" class="form-select" required>
            <option value="Cash">Cash</option>
            <option value="Card">Card</option>
            <option value="UPI">UPI</option>
            <option value="NetBanking">Net Banking</option>
            <option value="Cheque">Cheque</option>
          </select>
        </div>

        </div>

        <!-- ACTION BUTTON -->
        <div class="d-flex justify-content-end mt-4">
          <button type="submit" class="btn bg-gradient-dark px-4">
            💾 Save Expense
          </button>
        </div>

      </form>

    </div>
  </div>

</div>


</main>

{% include "includes/script.html" %}
</body>
</html>
