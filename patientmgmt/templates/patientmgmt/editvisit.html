{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="container my-4">
  <h3>Edit Visit</h3>
  <form method="post">
    {% csrf_token %}
    <div class="mb-2">
      <label>Diagnosis</label>
      <textarea name="diagnosis" class="form-control">{{ visit.diagnosis }}</textarea>
    </div>
    <div class="mb-2">
      <label>Prescription Notes</label>
      <textarea name="prescription_notes" class="form-control">{{ visit.prescription_notes }}</textarea>
    </div>
    <div class="mb-2">
      <label>Visit Date</label>
      <input name="visit_date" class="form-control" type="datetime-local" value="{{ visit.visit_date|date:'Y-m-d\\TH:i' }}">
    </div>
    <div class="mt-3">
      <button class="btn btn-primary" type="submit">Save</button>
      <a href="{% url 'patientmgmt:patient_detail' visit.patient.pk %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
