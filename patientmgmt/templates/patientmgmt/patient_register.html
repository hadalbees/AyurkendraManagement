{% load static %}
<!DOCTYPE html>
<html lang="en">
  {% include "includes/head.html" %}
  <body class="g-sidenav-show bg-gray-100">
    {% include "includes/sidebar.html" %}

    <main
      class="main-content position-relative max-height-vh-100 h-100 border-radius-lg"
    >
      {% include "includes/header.html" %}
      <div class="container-fluid py-2">
        <div class="row">
          <div class="col-12">
            <div class="card my-4">
              <div
                class="card-header p-0 position-relative mt-n4 mx-3 z-index-2"
              >
                <div
                  class="bg-gradient-dark shadow-dark border-radius-lg pt-4 pb-3"
                >
                  <h6 class="text-white text-capitalize ps-3">
                    Staff Management
                  </h6>
                  <a href="{% url 'staffaddform' %}" class="addbtn"
                    >Add Staff</a
                  >
                </div>
              </div>
              <div class="card-body px-0 pb-2">
                <form
                  method="post"
                  action="{% url 'patientmgmt:patient_register' %}"
                >
                  {% csrf_token %}  
                  <div class="row">
                    <div class="col-md-6 mb-2">
                      <label class="form-label">Consultant Doctor</label>
                      <input name="consultant_doctor" class="form-control" />
                    </div>
                    <div class="col-md-6 mb-2">
                      <label class="form-label">Department</label>
                      <input name="department" class="form-control" />
                    </div>

                    <div class="col-md-6 mb-2">
                      <label class="form-label">Patient Name</label>
                      <input
                        name="patient_name"
                        class="form-control"
                        required
                      />
                    </div>
                    <div class="col-md-3 mb-2">
                      <label class="form-label">Age</label>
                      <input name="age" class="form-control" type="number" />
                    </div>
                    <div class="col-md-3 mb-2">
                      <label class="form-label">Gender</label>
                      <select name="gender" class="form-select">
                        <option value="M">Male</option>
                        <option value="F">Female</option>
                        <option value="O">Other</option>
                      </select>
                    </div>

                    <div class="col-md-6 mb-2">
                      <label class="form-label">Phone</label>
                      <input name="phone" class="form-control" />
                    </div>
                    <div class="col-md-6 mb-2">
                      <label class="form-label">Email</label>
                      <input name="email" class="form-control" type="email" />
                    </div>

                    <div class="col-md-12 mb-2">
                      <label class="form-label">Address</label>
                      <textarea name="address" class="form-control"></textarea>
                    </div>

                    <div class="col-md-6 mb-2">
                      <label class="form-label">Patient Type</label>
                      <select name="patient_type" class="form-select" required>
                        <option value="OP">Outpatient</option>
                        <option value="IP">Inpatient</option>
                      </select>
                    </div>

                    <div class="col-md-6 mb-2">
                      <label class="form-label">Visit / Admit Date</label>
                      <input
                        name="visit_date"
                        class="form-control"
                        type="date"
                        value="{{ current_time|default:'' }}"
                      />
                    </div>

                    <div class="col-md-6 mb-2">
                      <label class="form-label">Assigned Doctor</label>
                      <input name="assigned_doctor" class="form-control" />
                    </div>

                    <div class="col-md-12 mb-2">
                      <label class="form-label">Notes</label>
                      <textarea name="notes" class="form-control"></textarea>
                    </div>
                  </div>

                  <div class="mt-3">
                    <button class="btn btn-primary" type="submit">
                      Register
                    </button>
                    <a
                      href="{% url 'patientmgmt:patient_list' %}"
                      class="btn btn-secondary"
                      >Back</a
                    >
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>

        {%include "includes/footer.html"%}
      </div>
    </main>
    {%include "includes/script.html"%}
  </body>
</html>
