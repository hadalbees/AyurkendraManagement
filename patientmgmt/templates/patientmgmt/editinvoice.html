{% extends "base.html" %}
{% load static %}
{% block content %}
<div class="container my-4">
  <h3>Edit Invoice #{{ invoice.pk }}</h3>
  <form method="post" id="invoiceForm">
    {% csrf_token %}
    <input type="hidden" id="items_count" name="items_count" value="{{ invoice.items.count }}">
    <div class="mb-3">
      <label>Invoice Date</label>
      <input type="date" name="invoice_date" class="form-control" value="{{ invoice.invoice_date }}">
    </div>
    <div class="mb-3">
      <label>Payment Status</label>
      <select name="payment_status" class="form-select">
        <option value="PENDING" {% if invoice.payment_status=="PENDING" %}selected{% endif %}>Pending</option>
        <option value="PAID" {% if invoice.payment_status=="PAID" %}selected{% endif %}>Paid</option>
        <option value="PARTIAL" {% if invoice.payment_status=="PARTIAL" %}selected{% endif %}>Partial</option>
      </select>
    </div>

    <hr>
    <h6>Items</h6>
    <table class="table table-sm" id="items_table">
      <thead>
        <tr>
          <th>Description</th><th>Qty</th><th>Unit Price</th><th>Line Total</th><th></th>
        </tr>
      </thead>
      <tbody>
        {% for it in invoice.items.all %}
        <tr>
          <td><input name="item_desc_{{ forloop.counter0 }}" class="form-control form-control-sm" value="{{ it.description }}"></td>
          <td><input name="item_qty_{{ forloop.counter0 }}" class="form-control form-control-sm row-qty" value="{{ it.quantity }}" type="number" step="0.01"></td>
          <td><input name="item_unit_{{ forloop.counter0 }}" class="form-control form-control-sm row-unit" value="{{ it.unit_price }}" type="number" step="0.01"></td>
          <td class="row-line text-end">{{ it.line_total }}</td>
          <td><button type="button" class="btn btn-sm btn-danger remove-row">x</button></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>

    <div class="mb-3 text-end">
      <strong>Total: ₹ <span id="invoice_total">{{ invoice.total_amount }}</span></strong>
    </div>

    <div class="mb-3">
      <button type="button" id="add_row" class="btn btn-sm btn-outline-primary">Add item</button>
    </div>

    <div class="mt-3">
      <button class="btn btn-primary" type="submit">Save Invoice</button>
      <a href="{% url 'patientmgmt:patient_detail' invoice.patient.pk %}" class="btn btn-secondary">Cancel</a>
    </div>
  </form>
</div>

<script>
(function(){
  let tbody = document.querySelector('#items_table tbody');
  let count = tbody.querySelectorAll('tr').length;
  document.getElementById('items_count').value = count;
  const totalEl = document.getElementById('invoice_total');

  function recalc(){
    let total = 0;
    tbody.querySelectorAll('tr').forEach(tr => {
      const qty = parseFloat(tr.querySelector('.row-qty').value || '0');
      const unit = parseFloat(tr.querySelector('.row-unit').value || '0');
      const lt = (qty * unit) || 0;
      const lineEl = tr.querySelector('.row-line');
      if(lineEl) lineEl.textContent = lt.toFixed(2);
      total += lt;
    });
    totalEl.textContent = total.toFixed(2);
  }

  function addRow(desc='', qty='1', unit='0'){
    const idx = count++;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input name="item_desc_${idx}" class="form-control form-control-sm" value="${desc}"></td>
      <td><input name="item_qty_${idx}" class="form-control form-control-sm row-qty" value="${qty}" type="number" step="0.01"></td>
      <td><input name="item_unit_${idx}" class="form-control form-control-sm row-unit" value="${unit}" type="number" step="0.01"></td>
      <td class="row-line text-end">0.00</td>
      <td><button type="button" class="btn btn-sm btn-danger remove-row">x</button></td>
    `;
    tbody.appendChild(tr);
    document.getElementById('items_count').value = count;
    tr.querySelectorAll('.row-qty, .row-unit').forEach(el => el.addEventListener('input', recalc));
    tr.querySelector('.remove-row').addEventListener('click', ()=>{
      tr.remove();
      count = tbody.querySelectorAll('tr').length;
      document.getElementById('items_count').value = count;
      recalc();
    });
    recalc();
  }

  document.getElementById('add_row').addEventListener('click', ()=> addRow());
  tbody.querySelectorAll('.row-qty, .row-unit').forEach(el => el.addEventListener('input', recalc));
  recalc();
})();
</script>
{% endblock %}
