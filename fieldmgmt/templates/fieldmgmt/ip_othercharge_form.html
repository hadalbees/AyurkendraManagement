{% load static %}
<!DOCTYPE html>
<html lang="en">

{% include "includes/head.html" %}

<body class="g-sidenav-show bg-gray-100">

{% include "includes/sidebar.html" %}

<main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg">

{% include "includes/header.html" %}

<div class="container-fluid py-4">

<div class="d-flex justify-content-between align-items-center mb-4">

<div>
<h4 class="fw-bold mb-1">
{% if obj %}Edit{% else %}Add{% endif %} Other Charge
</h4>

<p class="text-muted text-sm mb-0">
Create IP therapy / lab / medicine charge
</p>
</div>

<a href="{% url 'fieldmgmt:ip_othercharge_list' %}"
class="btn btn-outline-secondary rounded-pill px-4">
← Back
</a>

</div>


<div class="card shadow-sm border-0">

<div class="card-body px-4 py-4">

<form id="otherChargeForm" method="POST" novalidate>

{% csrf_token %}

<div class="row g-4">

<div class="col-md-6">

<label class="form-label fw-semibold">
Charge Name <span class="text-danger">*</span>
</label>

<input
type="text"
name="name"
class="form-control"
value="{{ obj.name|default:'' }}"
>
<small class="text-danger error-msg"></small>
</div>


<div class="col-md-6">

<label class="form-label fw-semibold">
Type <span class="text-danger">*</span>
</label>

<select name="type" class="form-select">
<option value="">Select Type </option>
<option value="Therapy"
{% if obj.type == "Therapy" %}selected{% endif %}>
Therapy
</option>

<option value="Lab"
{% if obj.type == "Lab" %}selected{% endif %}>
Lab
</option>

<option value="Medicine"
{% if obj.type == "Medicine" %}selected{% endif %}>
Medicine
</option>

<option value="Service"
{% if obj.type == "Service" %}selected{% endif %}>
Service
</option>

</select>
<small class="text-danger error-msg"></small>
</div>

<div class="col-md-6">

<label class="form-label fw-semibold">
Unit Price <span class="text-danger">*</span>
</label>

<input type="number" step="0.01" name="unit_price"
       class="form-control"
       value="{{ obj.unit_price|default:'' }}">
<small class="text-danger error-msg"></small>

</div>


<div class="col-md-12">

<label class="form-label fw-semibold">
Description
</label>

<textarea
name="description"
class="form-control"
rows="3">{{ obj.description|default:'' }}</textarea>

</div>


<div class="col-md-6 d-flex align-items-end">

<div class="form-check form-switch">

<input
class="form-check-input"
type="checkbox"
name="status"
{% if obj.status %}checked{% endif %}>

<label class="form-check-label fw-semibold">
Active
</label>

</div>

</div>

</div>


<div class="d-flex justify-content-end gap-2 mt-4">

<a href="{% url 'fieldmgmt:ip_othercharge_list' %}"
class="btn btn-outline-secondary px-4">
Cancel
</a>

<button type="submit"
class="btn bg-gradient-dark px-4">
Save
</button>

</div>

</form>

</div>

</div>

</div>
</main>

{% include "includes/script.html" %}
<script>

document.addEventListener("DOMContentLoaded", function () {

    const form = document.getElementById("otherChargeForm");

    function setError(input, message) {
        const error = input.parentElement.querySelector(".error-msg");
        input.classList.add("is-invalid");
        if (error) error.innerText = message;
    }

    function clearError(input) {
        const error = input.parentElement.querySelector(".error-msg");
        input.classList.remove("is-invalid");
        if (error) error.innerText = "";
    }

    const nameInput = document.querySelector('[name="name"]');
    const typeInput = document.querySelector('[name="type"]');
    const priceInput = document.querySelector('[name="unit_price"]');

    // 🔥 Allow only numbers + decimal
    priceInput.addEventListener("input", function () {
        this.value = this.value
            .replace(/[^0-9.]/g, '')       // remove non-numeric
            .replace(/(\..*?)\..*/g, '$1'); // only one dot
    });

    form.addEventListener("submit", function(e) {

        let isValid = true;

        // clear errors
        clearError(nameInput);
        clearError(typeInput);
        clearError(priceInput);

        // ✅ NAME
        if (!nameInput.value.trim()) {
            setError(nameInput, "Charge name is required");
            isValid = false;
        }

        // ✅ TYPE
        if (!typeInput.value) {
            setError(typeInput, "Please select type");
            isValid = false;
        }

        // ✅ UNIT PRICE
        if (!priceInput.value.trim()) {
            setError(priceInput, "Unit price is required");
            isValid = false;
        } 
        else if (!/^\d+(\.\d+)?$/.test(priceInput.value)) {
            setError(priceInput, "Enter valid number");
            isValid = false;
        } 
        else if (parseFloat(priceInput.value) <= 0) {
            setError(priceInput, "Must be greater than 0");
            isValid = false;
        }

        // ❌ STOP SUBMIT
        if (!isValid) {
            e.preventDefault();
            e.stopPropagation();
            form.querySelector(".is-invalid")?.focus();
            return false;
        }

    });

});

</script>

</body>
</html>
