{% load static %}
<!DOCTYPE html>
<html lang="en">
{% include "includes/head.html" %}

<body class="g-sidenav-show bg-gray-100">

{% include "includes/sidebar.html" %}

<main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg">
{% include "includes/header.html" %}

<div class="container-fluid py-4">

  <!-- PAGE HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h4 class="fw-bold mb-1">Add Therapy</h4>
      <p class="text-muted text-sm mb-0">
        Create a new therapy with description and charges
      </p>
    </div>

    <a href="{% url 'fieldmgmt:therapy_list' %}"
       class="btn btn-outline-secondary rounded-pill px-4">
      ← Back
    </a>
  </div>

  <!-- FORM CARD -->
  <div class="card shadow-sm border-0">
    <div class="card-body px-4 py-4">

      <form id="therapyForm" method="POST" novalidate>
        {% csrf_token %}

        <div class="row g-4">

          <div class="col-md-6">
            <label class="form-label fw-semibold">
              Therapy Name <span class="text-danger">*</span>
            </label>
            <input type="text" name="name" class="form-control">
            <small class="text-danger error-msg"></small>
          </div>

          <div class="col-md-6">
            <label class="form-label fw-semibold">
              Charges <span class="text-danger">*</span>
            </label>
            <input type="number" name="charges" class="form-control">
            <small class="text-danger error-msg"></small>
          </div>

          <!-- Description -->
          <div class="col-md-12">
            <label class="form-label fw-semibold">
              Description
            </label>
            <textarea name="description"
                      class="form-control"
                      rows="3"
                      placeholder="Optional therapy description"></textarea>
          </div>

          <!-- Status -->
          <div class="col-md-12">
            <div class="form-check form-switch mt-2">
              <input class="form-check-input"
                     type="checkbox"
                     name="status"
                     id="statusSwitch"
                     checked>
              <label class="form-check-label fw-semibold" for="statusSwitch">
                Active
              </label>
            </div>
          </div>

        </div>

        <!-- ACTIONS -->
        <div class="d-flex justify-content-end gap-2 mt-4">
          <a href="{% url 'fieldmgmt:therapy_list' %}"
             class="btn btn-outline-secondary px-4">
            Cancel
          </a>
          <button type="submit"
                  class="btn bg-gradient-dark px-4">
            Save Therapy
          </button>
        </div>

      </form>

    </div>
  </div>

</div>


</main>

{% include "includes/script.html" %}
<script>

document.addEventListener("DOMContentLoaded", function () {

    const form = document.getElementById("therapyForm");

    function setError(input, message) {
        const error = input.parentElement.querySelector(".error-msg");
        input.classList.add("is-invalid");
        if (error) error.innerText = message;
    }

    function clearError(input) {
        const error = input.parentElement.querySelector(".error-msg");
        input.classList.remove("is-invalid");
        if (error) error.innerText = "";
    }

    // 🔥 real-time number validation
    const chargesInput = document.querySelector('[name="charges"]');

    chargesInput.addEventListener("input", function () {
        this.value = this.value.replace(/[^0-9.]/g, ""); // allow only numbers + dot
    });

    form.addEventListener("submit", function(e) {

        let isValid = true;

        const name = document.querySelector('[name="name"]');
        const charges = document.querySelector('[name="charges"]');

        // clear errors
        clearError(name);
        clearError(charges);

        // ✅ NAME
        if (!name.value.trim()) {
            setError(name, "Therapy name is required");
            isValid = false;
        }

        // ✅ CHARGES
        if (!charges.value.trim()) {
            setError(charges, "Charges are required");
            isValid = false;
        } 
        else if (!/^\d+(\.\d+)?$/.test(charges.value)) {
            setError(charges, "Enter valid amount");
            isValid = false;
        } 
        else if (parseFloat(charges.value) <= 0) {
            setError(charges, "Must be greater than 0");
            isValid = false;
        }

        // ❌ STOP SUBMIT
        if (!isValid) {
            e.preventDefault();
            e.stopPropagation();
            form.querySelector(".is-invalid")?.focus();
            return false;
        }

    });

});

</script>
</body>
</html>
