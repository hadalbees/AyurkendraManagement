{% load static %}
<!DOCTYPE html>
<html lang="en">
{% include "includes/head.html" %}

<body class="g-sidenav-show bg-gray-100">

{% include "includes/sidebar.html" %}

<main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg">
{% include "includes/header.html" %}

<div class="container-fluid py-4">

  <!-- PAGE HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h4 class="fw-bold mb-1">Edit Therapy</h4>
      <p class="text-muted text-sm mb-0">
        Update therapy details, charges and status
      </p>
    </div>

    <a href="{% url 'fieldmgmt:therapy_list' %}"
       class="btn btn-outline-secondary rounded-pill px-4">
      ← Back
    </a>
  </div>

  <!-- FORM CARD -->
  <div class="card shadow-sm border-0">
    <div class="card-body px-4 py-4">

      <form method="POST">
        {% csrf_token %}

        <div class="row g-4">

          <!-- Therapy Name -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">
              Therapy Name <span class="text-danger">*</span>
            </label>
            <input type="text"
                   name="name"
                   class="form-control"
                   value="{{ therapy.name }}"
                   required>
          </div>

          <!-- Charges -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">
              Charges <span class="text-danger">*</span>
            </label>
            <input type="number"
                   step="0.01"
                   name="charges"
                   class="form-control"
                   value="{{ therapy.charges }}"
                   required>
          </div>

          <!-- Description -->
          <div class="col-md-12">
            <label class="form-label fw-semibold">
              Description
            </label>
            <textarea name="description"
                      class="form-control"
                      rows="3">{{ therapy.description }}</textarea>
          </div>

          <!-- Status -->
          <div class="col-md-12">
            <div class="form-check form-switch mt-2">
              <input class="form-check-input"
                     type="checkbox"
                     name="status"
                     id="statusSwitch"
                     {% if therapy.status %}checked{% endif %}>
              <label class="form-check-label fw-semibold" for="statusSwitch">
                Active
              </label>
            </div>
          </div>

        </div>

        <!-- ACTIONS -->
        <div class="d-flex justify-content-end gap-2 mt-4">
          <a href="{% url 'fieldmgmt:therapy_list' %}"
             class="btn btn-outline-secondary px-4">
            Cancel
          </a>
          <button type="submit"
                  class="btn bg-gradient-dark px-4">
            Update Therapy
          </button>
        </div>

      </form>

    </div>
  </div>

</div>


</main>

{% include "includes/script.html" %}
</body>
</html>
