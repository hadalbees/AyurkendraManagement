{% load static %}
<!DOCTYPE html>
<html lang="en">
{% include "includes/head.html" %}

<body class="g-sidenav-show bg-gray-100">

{% include "includes/sidebar.html" %}

<main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg">
{% include "includes/header.html" %}

<div class="container-fluid py-4">

  <!-- PAGE HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h4 class="fw-bold mb-1">{{ title }}</h4>
      <p class="text-muted text-sm mb-0">
        Manage supplier contact and address information
      </p>
    </div>

    <a href="{% url 'fieldmgmt:supplier_list' %}"
       class="btn btn-outline-secondary rounded-pill px-4">
      ← Back
    </a>
  </div>

  <!-- FORM CARD -->
  <div class="card shadow-sm border-0">
    <div class="card-body px-4 py-4">

      <form method="post">
        {% csrf_token %}

        <div class="row g-4">

          <!-- Supplier Name -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">
              Supplier Name <span class="text-danger">*</span>
            </label>
            <input type="text"
                   name="name"
                   class="form-control"
                   placeholder="Enter supplier name"
                   value="{{ supplier.name|default:'' }}"
                   required>
          </div>

          <!-- Phone -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">
              Phone Number
            </label>
            <input type="text"
                   name="phone"
                   class="form-control"
                   placeholder="Enter phone number"
                   value="{{ supplier.phone|default:'' }}">
          </div>

          <!-- Email -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">
              Email Address
            </label>
            <input type="email"
                   name="email"
                   class="form-control"
                   placeholder="Enter email address"
                   value="{{ supplier.email|default:'' }}">
          </div>

          <!-- Address -->
          <div class="col-md-6">
            <label class="form-label fw-semibold">
              Address
            </label>
            <textarea name="address"
                      class="form-control"
                      rows="3"
                      placeholder="Enter supplier address">{{ supplier.address|default:'' }}</textarea>
          </div>

        </div>

        <!-- ACTION BUTTONS -->
        <div class="d-flex justify-content-end gap-2 mt-4">
          <a href="{% url 'fieldmgmt:supplier_list' %}"
             class="btn btn-outline-secondary px-4">
            Cancel
          </a>

          <button type="submit"
                  class="btn bg-gradient-dark px-4">
            Save Supplier
          </button>
        </div>

      </form>

    </div>
  </div>

</div>


</main>

{% include "includes/script.html" %}
</body>
</html>
