{% load static %}
<!doctype html>
<html>
{% include "includes/head.html" %}
<body>
{% include "includes/header.html" %}
<div class="container my-4">
  <h3>Add Medicine</h3>
  <form method="post">{% csrf_token %}
    <div class="row">
      <div class="col-md-4 mb-2"><label>Code</label><input name="code" class="form-control" required></div>
      <div class="col-md-4 mb-2"><label>Name</label><input name="name" class="form-control" required></div>
      <div class="col-md-4 mb-2"><label>Brand</label><input name="brand" class="form-control"></div>
      <div class="col-md-3 mb-2"><label>Unit</label><input name="unit" class="form-control" value="strip"></div>
      <div class="col-md-3 mb-2"><label>MRP</label><input name="mrp" type="number" step="0.01" class="form-control"></div>
      <div class="col-md-3 mb-2"><label>Selling Price</label><input name="selling_price" type="number" step="0.01" class="form-control"></div>
      <div class="col-md-3 mb-2"><label>Purchase Price</label><input name="purchase_price" type="number" step="0.01" class="form-control"></div>
      <div class="col-md-3 mb-2"><label>GST %</label><input name="gst" type="number" step="0.01" class="form-control"></div>
    </div>
    <div class="mt-3"><button class="btn btn-primary" type="submit">Create</button></div>
  </form>
</div>
{% include "includes/footer.html" %}
</body>
</html>
