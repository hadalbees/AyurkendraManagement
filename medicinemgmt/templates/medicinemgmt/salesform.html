{% load static %}
<!doctype html>
<html>
{% include "includes/head.html" %}
<body>
{% include "includes/header.html" %}
<div class="container my-4">
  <h3>Create Sale Invoice</h3>
  <form method="post" id="saleForm">{% csrf_token %}
    <div class="row mb-3">
      <div class="col-md-4"><label>Patient</label>
        <select name="patient" class="form-select">
          <option value="">Walk-in</option>
          {% for p in patients %}<option value="{{ p.pk }}">{{ p.patient_name }} ({{ p.get_patient_type_display }})</option>{% endfor %}
        </select>
      </div>
      <div class="col-md-4"><label>Invoice date</label><input name="sale_date" type="date" class="form-control" value="{{ today|default:'' }}"></div>
      <div class="col-md-4"><label>Payment status</label><select name="payment_status" class="form-select"><option value="PENDING">Pending</option><option value="PAID">Paid</option></select></div>
    </div>

    <table class="table" id="items_table">
      <thead><tr><th>Medicine</th><th>Batch (optional)</th><th>Qty</th><th>Unit price</th><th>Line</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <input type="hidden" id="items_count" name="items_count" value="0">
    <div class="text-end mb-3"><strong>Total: ₹<span id="total">0.00</span></strong></div>
    <div class="mb-3"><label>Notes</label><textarea name="notes" class="form-control"></textarea></div>
    <button class="btn btn-success" type="submit">Create Invoice</button>
  </form>
</div>

<script>
(function(){
  let count=0;
  const tbody=document.querySelector('#items_table tbody');
  const totalEl=document.getElementById('total');
  const itemsCount=document.getElementById('items_count');

  // build medicine options with data of batches via an endpoint would be cleaner.
  const meds = [{% for m in medicines %}{id:{{ m.pk }}, name:"{{ m.name|escapejs }}", sell:"{{ m.selling_price }}"}{% if not forloop.last %},{% endif %}{% endfor %}];

  function recalc(){
    let t=0;
    tbody.querySelectorAll('tr').forEach(tr=>{
      const qty=parseFloat(tr.querySelector('.row-qty').value||'0');
      const up=parseFloat(tr.querySelector('.row-unit').value||'0');
      const lt=(qty*up)||0;
      tr.querySelector('.row-line').textContent = lt.toFixed(2);
      t+=lt;
    });
    totalEl.textContent = t.toFixed(2);
  }

  function addRow(){
    const idx=count++;
    const tr=document.createElement('tr');
    let medicOptions = '<option value="">--Select--</option>';
    meds.forEach(m=> medicOptions += `<option value="${m.id}" data-price="${m.sell}">${m.name}</option>`);
    tr.innerHTML = `<td><select name="item_med_${idx}" class="form-select med-select">${medicOptions}</select></td>
      <td><select name="item_batch_${idx}" class="form-select batch-select"><option value="">(auto FIFO)</option></select></td>
      <td><input name="item_qty_${idx}" class="form-control row-qty" value="1" type="number" step="0.01"></td>
      <td><input name="item_unit_${idx}" class="form-control row-unit" value="0" type="number" step="0.01"></td>
      <td class="row-line text-end">0.00</td>
      <td><button type="button" class="btn btn-sm btn-danger remove">x</button></td>`;
    tbody.appendChild(tr);
    itemsCount.value = count;

    // when medicine selected, prefill unit price and load batches via AJAX (optional)
    const medSelect = tr.querySelector('.med-select');
    medSelect.addEventListener('change', function(){
      const price = medSelect.selectedOptions[0].dataset.price || '0';
      tr.querySelector('.row-unit').value = parseFloat(price).toFixed(2);
      // optionally fetch batches for this medicine via API endpoint to populate batch-select
      // skipping AJAX here - batch-select remains (default auto)
    });

    tr.querySelectorAll('.row-qty,.row-unit').forEach(el=>el.addEventListener('input', recalc));
    tr.querySelector('.remove').addEventListener('click', ()=>{ tr.remove(); count = tbody.querySelectorAll('tr').length; itemsCount.value = count; recalc(); });
    recalc();
  }

  document.addEventListener('DOMContentLoaded', function(){ addRow(); });
  document.getElementById('saleForm').addEventListener('submit', function(){ itemsCount.value = tbody.querySelectorAll('tr').length; });
})();
</script>

{% include "includes/footer.html" %}
</body>
</html>
