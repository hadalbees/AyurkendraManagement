<script>
/* ---------- CHARTS (SAFE) ---------- */
function initChart(id, config) {
  const el = document.getElementById(id);
  if (el) {
    new Chart(el.getContext("2d"), config);
  }
}

/* Bar Chart */
initChart("chart-bars", {
  type: "bar",
  data: {
    labels: ["M","T","W","T","F","S","S"],
    datasets: [{
      data: [50,45,22,28,50,60,76],
      backgroundColor: "#43A047",
      borderRadius: 4
    }]
  },
  options: { responsive: true, plugins:{ legend:{ display:false } } }
});

/* Line Chart */
initChart("chart-line", {
  type: "line",
  data: {
    labels: ["J","F","M","A","M","J","J","A","S","O","N","D"],
    datasets: [{
      data: [120,230,130,440,250,360,270,180,90,300,310,220],
      borderColor: "#43A047",
      tension: 0
    }]
  },
  options: { responsive:true, plugins:{ legend:{ display:false } } }
});
</script>

<script>
/* ---------- MARK ATTENDANCE ---------- */
const markBtn = document.getElementById("mark-attendance");

if (markBtn) {
  markBtn.addEventListener("click", function (e) {
    e.preventDefault();

    fetch("{% url 'attendancemgmt:employee_mark' %}", {
      method: "POST",
      headers: {
        "X-CSRFToken": "{{ csrf_token }}",
        "Content-Type": "application/x-www-form-urlencoded",
      },
      body: "status=Present"
    })
    .then(res => res.json())
    .then(data => {
      alert(data.ok ? `Attendance marked for ${data.date}` : data.error);
    });
  });
}


document.addEventListener("DOMContentLoaded", function () {

      const avatar = document.getElementById("userboxAvatar");
  const menu = document.getElementById("userboxMenu");

  avatar.addEventListener("click", function (e) {
    e.stopPropagation();
    menu.classList.toggle("show-menu");
  });

  document.addEventListener("click", function () {
    menu.classList.remove("show-menu");
  });

});

document.addEventListener("DOMContentLoaded", function () {

  const sidebar = document.getElementById("sidenav-main");
  const toggleBtn = document.getElementById("sidebarToggle");
  const closeBtn = document.getElementById("sidebarClose");
  const overlay = document.getElementById("sidebarOverlay");

  function openSidebar() {
    sidebar.classList.add("mobile-show");
    overlay.classList.add("show");
    document.body.style.overflow = "hidden";
  }

  function closeSidebar() {
    sidebar.classList.remove("mobile-show");
    overlay.classList.remove("show");
    document.body.style.overflow = "";
  }

  // Toggle button
  if (toggleBtn) {
    toggleBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      sidebar.classList.contains("mobile-show") ? closeSidebar() : openSidebar();
    });
  }

  // Close icon
  if (closeBtn) {
    closeBtn.addEventListener("click", closeSidebar);
  }

  // Overlay click
  if (overlay) {
    overlay.addEventListener("click", closeSidebar);
  }

  // ESC key
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      closeSidebar();
    }
  });

});

function toggleBillMenu(btn) {
  const wrapper = btn.closest('.bill-action-wrapper');
  const menu = wrapper.querySelector('.bill-action-menu');

  // Close others
  document.querySelectorAll('.bill-action-wrapper').forEach(el => {
    if (el !== wrapper) el.classList.remove('active');
  });

  wrapper.classList.toggle('active');

  // 🔥 FIX: Use offset instead of viewport
  const btnRect = btn.getBoundingClientRect();
  const scrollTop = window.pageYOffset || document.documentElement.scrollTop;

  const menuHeight = 220;
  const spaceBelow = window.innerHeight - btnRect.bottom;

  if (spaceBelow < menuHeight) {
    // Open upward
    menu.style.top = "auto";
    menu.style.bottom = "100%";
  } else {
    // Open downward
    menu.style.top = "100%";
    menu.style.bottom = "auto";
  }

  // 🔥 RESET horizontal alignment (important)
  menu.style.left = "auto";
  menu.style.right = "0";
}


document.addEventListener("click",function(e){

  if(!e.target.closest(".bill-action-wrapper")){
      document.querySelectorAll(".bill-action-menu").forEach(menu=>{
          menu.classList.remove("show");
      });
  }

});
</script>
