<!-- ================= CORE JS ================= -->

<!-- ================= CUSTOM SCRIPTS ================= -->

<script>


/* ---------- TOAST AUTO SHOW ---------- */
document.addEventListener("DOMContentLoaded", function () {
  document.querySelectorAll('.toast').forEach((toastEl) => {
    new bootstrap.Toast(toastEl).show();
  });
});
</script>

<script>
/* ---------- PERFECT SCROLLBAR ---------- */
var win = navigator.platform.indexOf("Win") > -1;
if (win && document.querySelector("#sidenav-main")) {
  Scrollbar.init(document.querySelector("#sidenav-main"), {
    damping: "0.5",
  });
}
</script>

<script>
/* ---------- CHARTS (SAFE) ---------- */
function initChart(id, config) {
  const el = document.getElementById(id);
  if (el) {
    new Chart(el.getContext("2d"), config);
  }
}

/* Bar Chart */
initChart("chart-bars", {
  type: "bar",
  data: {
    labels: ["M","T","W","T","F","S","S"],
    datasets: [{
      data: [50,45,22,28,50,60,76],
      backgroundColor: "#43A047",
      borderRadius: 4
    }]
  },
  options: { responsive: true, plugins:{ legend:{ display:false } } }
});

/* Line Chart */
initChart("chart-line", {
  type: "line",
  data: {
    labels: ["J","F","M","A","M","J","J","A","S","O","N","D"],
    datasets: [{
      data: [120,230,130,440,250,360,270,180,90,300,310,220],
      borderColor: "#43A047",
      tension: 0
    }]
  },
  options: { responsive:true, plugins:{ legend:{ display:false } } }
});
</script>

<script>
/* ---------- MARK ATTENDANCE ---------- */
const markBtn = document.getElementById("mark-attendance");

if (markBtn) {
  markBtn.addEventListener("click", function (e) {
    e.preventDefault();

    fetch("{% url 'attendancemgmt:employee_mark' %}", {
      method: "POST",
      headers: {
        "X-CSRFToken": "{{ csrf_token }}",
        "Content-Type": "application/x-www-form-urlencoded",
      },
      body: "status=Present"
    })
    .then(res => res.json())
    .then(data => {
      alert(data.ok ? `Attendance marked for ${data.date}` : data.error);
    });
  });
}


document.addEventListener("DOMContentLoaded", function () {

      const avatar = document.getElementById("userboxAvatar");
  const menu = document.getElementById("userboxMenu");

  avatar.addEventListener("click", function (e) {
    e.stopPropagation();
    menu.classList.toggle("show-menu");
  });

  document.addEventListener("click", function () {
    menu.classList.remove("show-menu");
  });

});
</script>
